name: Build and Deploy ÒsánVault Africa Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # The historical fetch-net-data.py referenced by the legacy workflow is not
      # present in the repository. Do not fabricate or silently replace its data
      # source. Until a verified data provider is restored, the build consumes the
      # committed data/net-data.json snapshot deterministically.
      - name: Validate committed data snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [Path("data/net-data.json"), Path("data/properties.json")]:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Validated {path}")
          PY

      - name: Generate Website Pages
        run: python scripts/generate-pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
